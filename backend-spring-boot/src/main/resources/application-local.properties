spring.application.name=autonomous-job-agent-backend
server.port=8080

# In-Memory H2 Database (Zero-Config local execution & testing)
spring.datasource.url=jdbc:h2:mem:job_agent_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console available at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis Configuration (Optional connection for local standalone)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging
logging.level.com.bot=INFO
logging.level.org.springframework.web=INFO
